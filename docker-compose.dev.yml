services :
  db : 
    ports :
      - "3306:3306"
  app :
    environment :
      DEBUG_MODE: "true"
    volumes :
      - ./app:/app
  adminer:
    image: adminer
    container_name: gymtrack-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymtrack-network
      - shared-net
  frontend:
    volumes:
      - ./frontend:/usr/share/nginx/html
        