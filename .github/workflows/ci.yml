name: CI - Build & Tests
 
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Tests pytest (sans MySQL)
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
 
      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 

      - name: Installer les dépendances
        run: pip install -r app/requirements.txt
 
      - name: Lancer les tests pytest
        run: pytest app/tests/ -v
  
  build:
    name: Vérifier que Docker build sans erreur
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
  
        # On build uniquement l'image Flask pour vérifier que le Dockerfile est valide
      - name: Build de l'image Docker Flask
        run: docker build ./app -t gymtrack-app:ci

  push : 
    name : Push de l'image sur GHCR 
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name : login  sur GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name : Installer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build et push de l'image Docker Flask sur GHCR
        uses : docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ./app
          push: true
          tags: ghcr.io/khalil-bec/gymtrack-app:${{ github.sha }},ghcr.io/khalil-bec/gymtrack-app:latest

         