services:

  db:
    image: mysql:8.0
    container_name: ${DB_HOST}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql
    networks:
      - gymtrack-network
      - shared-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    container_name: gymtrack-app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DEBUG_MODE: "false"
    depends_on:
      db:
        condition: service_healthy  
    networks:
      - gymtrack-network
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s




  frontend:
    build: ./frontend
    ports:
      - "8001:80"
    networks:
      - gymtrack-network
      - shared-net
    depends_on:
      app:
        condition: service_healthy


    
volumes:
  db-data:

networks:
  gymtrack-network:
    driver: bridge
  shared-net:
    external: true  